
name: Build ESCUDO DO MESTRE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto otimizado
        shell: bash
        run: |
          set -euo pipefail
          unzip -t escudo_mestre_v1_37.zip

          if unzip -Z1 escudo_mestre_v1_37.zip | grep -q '^\.github/workflows/android.yml$'; then
            echo "::error::O workflow deve existir apenas na raiz do repositório."
            exit 1
          fi

          unzip -o escudo_mestre_v1_37.zip -d /tmp/escudo
          cp -R /tmp/escudo/app .
          cp /tmp/escudo/build.gradle.kts .
          cp /tmp/escudo/settings.gradle.kts .
          cp /tmp/escudo/gradle.properties .

      - name: Preparar assinatura permanente
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_SIGNING_BUNDLE:-}" ]; then
            echo "::error::Falta cadastrar o segredo ANDROID_SIGNING_BUNDLE."
            exit 1
          fi

          SIGNING_JSON="$RUNNER_TEMP/escudo-signing.json"
          KEYSTORE_FILE="$RUNNER_TEMP/escudo-release.jks"
          trap 'rm -f "$SIGNING_JSON"' EXIT

          umask 077
          printf '%s' "$ANDROID_SIGNING_BUNDLE" > "$SIGNING_JSON"
          jq -e '.keystoreBase64 and .storePassword and .keyAlias and .keyPassword' "$SIGNING_JSON" > /dev/null

          STORE_PASSWORD="$(jq -r '.storePassword' "$SIGNING_JSON")"
          KEY_ALIAS="$(jq -r '.keyAlias' "$SIGNING_JSON")"
          KEY_PASSWORD="$(jq -r '.keyPassword' "$SIGNING_JSON")"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"

          jq -r '.keystoreBase64' "$SIGNING_JSON" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          {
            printf 'ANDROID_KEYSTORE_FILE=%s\n' "$KEYSTORE_FILE"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          unset ANDROID_SIGNING_BUNDLE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD

      - name: Verificar estrutura, dependências e otimizações
        shell: bash
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/br/com/escudodomestre/MainActivity.kt"

          test -f "$MAIN"
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json
          test -f app/src/main/res/drawable/ic_d20.xml
          test -f app/src/main/res/values/ids.xml
          test -f app/src/main/res/xml/file_paths.xml
          test -f /tmp/escudo/firebase/firestore.rules

          grep -q 'namespace = "br.com.escudodomestre"' app/build.gradle.kts
          grep -q 'applicationId = "br.com.escudodomestre"' app/build.gradle.kts
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "1.37"' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-auth' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts

          ! grep -q 'ui-tooling-preview' app/build.gradle.kts
          ! grep -q 'ui-tooling"' app/build.gradle.kts

          ! grep -Fq 'locateTextBlockAtCursor' "$MAIN"
          ! grep -Fq 'BoxThumbnailImage' "$MAIN"
          ! grep -Fq 'loadInlineDrawable' "$MAIN"

          ! grep -Eq '^import .*ColorDrawable|^import .*roundToInt|^import .*TextFieldValue|^import .*TextRange|^import .*onFocusChanged|^import .*FirebaseUser' "$MAIN"

          grep -Fq 'requestInlineImageAsync' "$MAIN"
          grep -Fq 'pendingInlineImageCallbacks' "$MAIN"
          grep -Fq 'inlineImageCache' "$MAIN"
          grep -Fq 'refreshInlineImage' "$MAIN"
          grep -Fq 'imageAspectRatioCache' "$MAIN"
          grep -Fq 'private fun shareUriForOwnedImage' "$MAIN"
          grep -Fq 'boxImageCopyExecutor.execute' "$MAIN"
          grep -Fq 'coverImageExecutor = Executors.newFixedThreadPool(3)' "$MAIN"
          grep -Fq 'private class NoteEditorHistory' "$MAIN"
          grep -Fq 'fun applyEditorHistory(isRedo: Boolean)' "$MAIN"
          grep -Fq 'Intent.ACTION_SEND_MULTIPLE' "$MAIN"
          grep -Fq 'dragAndDropTarget' "$MAIN"
          grep -Fq 'private fun configurePaperEditor(' "$MAIN"
          grep -Fq 'private class ImageFlowMarginSpan(' "$MAIN"
          grep -Fq 'private class NoteInlineBoxSpan(' "$MAIN"
          grep -Fq 'Preserve the periodic recovery checkpoint' "$MAIN"

      - name: Configurar Gradle e cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Construir APK assinado
        run: gradle assembleRelease

      - name: Verificar assinatura do APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Limpar arquivo temporário da assinatura
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/escudo-signing.json" "$RUNNER_TEMP/escudo-release.jks"

      - name: Salvar APK
        uses: actions/upload-artifact@v7
        with:
          name: ESCUDO-DO-MESTRE-APK-v1.37
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
