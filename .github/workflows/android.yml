
name: Build ESCUDO DO MESTRE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o escudo_mestre_v1_28.zip -d /tmp/escudo
          cp -R /tmp/escudo/app .
          cp /tmp/escudo/build.gradle.kts .
          cp /tmp/escudo/settings.gradle.kts .
          cp /tmp/escudo/gradle.properties .

      - name: Preparar assinatura permanente
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ANDROID_SIGNING_BUNDLE" ]; then
            echo "::error::Falta cadastrar o segredo ANDROID_SIGNING_BUNDLE."
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_BUNDLE" > "$RUNNER_TEMP/escudo-signing.json"
          jq -e '.keystoreBase64 and .storePassword and .keyAlias and .keyPassword' "$RUNNER_TEMP/escudo-signing.json" > /dev/null
          jq -r '.keystoreBase64' "$RUNNER_TEMP/escudo-signing.json" | base64 --decode > "$RUNNER_TEMP/escudo-release.jks"
          test -s "$RUNNER_TEMP/escudo-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/escudo-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$(jq -r '.storePassword' "$RUNNER_TEMP/escudo-signing.json")" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$(jq -r '.keyAlias' "$RUNNER_TEMP/escudo-signing.json")" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$(jq -r '.keyPassword' "$RUNNER_TEMP/escudo-signing.json")" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/escudo-signing.json"

      - name: Verificar estrutura, versão e novos recursos
        run: |
          test -f app/src/main/java/br/com/escudodomestre/MainActivity.kt
          test -f app/google-services.json
          test -f app/src/main/res/xml/file_paths.xml
          grep -q 'com.google.firebase:firebase-auth' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "1.28"' app/build.gradle.kts
          grep -q 'copyPickedImageToApp' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'ActivityResultContracts.PickVisualMedia()' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'ActivityResultContracts.PickMultipleVisualMedia(MAX_COVER_GALLERY_IMAGES)' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'NoteInlineBoxSpan' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'NoteBlock(kind = "box", boxId = box.id)' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'fitInside = true' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'CLOUD_IMAGE_MAX_SIDE = 1536' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'CLOUD_IMAGE_MAX_BYTES = 95_000' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'Intent.ACTION_SEND_MULTIPLE' app/src/main/java/br/com/escudodomestre/MainActivity.kt
          grep -q 'dragAndDropTarget' app/src/main/java/br/com/escudodomestre/MainActivity.kt

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construir APK assinado
        run: gradle assembleRelease

      - name: Verificar assinatura do APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ESCUDO-DO-MESTRE-APK-v1.28
          path: app/build/outputs/apk/release/app-release.apk
          
