name: Build ESCUDO DO MESTRE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o escudo_mestre_v1_19.zip -d /tmp/escudo
          cp -R /tmp/escudo/app .
          cp /tmp/escudo/build.gradle.kts .
          cp /tmp/escudo/settings.gradle.kts .
          cp /tmp/escudo/gradle.properties .

      - name: Verificar configuração Firebase
        run: |
          test -f app/src/main/java/br/com/escudodomestre/MainActivity.kt
          test -f app/google-services.json
          grep -q 'com.google.firebase:firebase-auth' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construir APK
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ESCUDO-DO-MESTRE-APK-v1.19
          path: app/build/outputs/apk/debug/app-debug.apk
