
name: Build ESCUDO DO MESTRE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o escudo_mestre_v1_3.zip -d /tmp/escudo
          cp -R /tmp/escudo/app .
          cp /tmp/escudo/build.gradle.kts .
          cp /tmp/escudo/settings.gradle.kts .
          cp /tmp/escudo/gradle.properties .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ESCUDO-DO-MESTRE-APK-v1.3
          path: app/build/outputs/apk/debug/app-debug.apk
          
